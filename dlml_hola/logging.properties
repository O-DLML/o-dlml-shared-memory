############################################################
# Minimal Java logger configuration
# Prints only the message text (no date or level)
############################################################

# Global level (change to FINE for more detail)
.level = INFO

# Console output only
handlers = java.util.logging.ConsoleHandler

# Handler level
java.util.logging.ConsoleHandler.level = INFO

# Simple format: just the message (%5$s) and a newline
java.util.logging.SimpleFormatter.format=%5$s%n

# Attach the formatter to the handler
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Per-class levels (optional)
DLMLLocal.level = OFF
ProtocolThread.level = OFF
