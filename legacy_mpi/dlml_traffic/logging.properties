############################################################
# Configuración mínima del logger de Java
# Muestra solo el texto del mensaje (sin fecha ni nivel)
############################################################

# Nivel global (puedes cambiar a FINE para ver más detalle)
.level = INFO

# Usar solo salida a consola
handlers = java.util.logging.ConsoleHandler

# Nivel del manejador
java.util.logging.ConsoleHandler.level = INFO

# Formato simple: solo el mensaje (%5$s) y salto de línea
java.util.logging.SimpleFormatter.format=%5$s%n

# Asociar el manejador a la clase o paquete
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Ejemplo de niveles específicos (opcional)
DLML.level = OFF
Protocol.level = OFF
